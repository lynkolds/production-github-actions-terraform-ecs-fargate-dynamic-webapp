name: Stop EC2 Runner

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner label from the Start EC2 Runner workflow"
        default: "" # replace with runner label from start runner workflow
        required: true
      ec2_instance_id:
        description: "EC2 instance ID from the Start EC2 Runner workflow"
        required: true
        default: "" # replace with instance id from start runner workflow

env:
  AWS_REGION: us-east-1

jobs:
  stop_runner:
    environment: # update with your environment name
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          label: ${{ inputs.runner_label }}
          ec2-instance-id: ${{ inputs.ec2_instance_id }}