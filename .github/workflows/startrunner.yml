name: Start EC2 Runner

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  start_runner:
    environment:  # update with your environment name
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start_runner.outputs.label }}
      ec2_instance_id: ${{ steps.start_runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Start EC2 runner
        id: start_runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: # ami of ec2 runner with docker pre-installed
          ec2-instance-type: # update based on your needs. t3.micro is reasonably priced and sufficient for most CI workloads
          subnet-id:  # update after iac job
          security-group-id:  # update after iac job
          iam-role-name:  # existing role's instance profile with ecr permissions
          startup-timeout-minutes: 10
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "ec2-github-runner"},
              {"Key": "GitHubRepository", "Value": "${{ github.repository }}"}
            ]

      - name: Show runner info
        run: |
          echo "Runner label: ${{ steps.start_runner.outputs.label }}"
          echo "EC2 instance id: ${{ steps.start_runner.outputs.ec2-instance-id }}"